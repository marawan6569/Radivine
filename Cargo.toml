[workspace]
resolver = "3"
members = [
    "crates/radivine-wheel",
    "crates/radivine-render",
    "crates/radivine-core",
    "crates/radivine-dbus",
    "crates/radivine-actions",
    "crates/radivine-platform",
    "crates/radivine-convert",
    "crates/radivine-convert-image",
    "crates/radivine-jobs",
    "ffi/radivine-webp",
    "apps/radivine",
    "apps/radivine-viewer",
    "apps/radivine-control",
    "apps/radivine-worker",
    "tools/wheel-sandbox",
    "tools/convert-corpus",
    "tools/convert-cli",
]
exclude = [
    "spikes/xdnd-overlay",
    "spikes/convert-spikes",
    "fuzz",
]

[workspace.package]
version = "0.3.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marawan6569/Radivine"
description = "A fast, extensible, context-aware radial action wheel for your desktop."

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
smallvec = "1.15"
thiserror = "2.0"
tiny-skia = { version = "0.11", features = ["png-format"] }
cosmic-text = "0.12"
resvg = "0.44"
winit = "0.30"
softbuffer = "0.4"
proptest = "1.6"
criterion = "0.5"
percent-encoding = "2.3"
mime_guess = "2.0"
tracing = "0.1"
x11rb = { version = "0.13", features = ["composite", "shm", "shape", "xfixes", "xinput", "randr", "res", "render", "resource_manager", "cursor"] }
rustix = { version = "1.0", features = ["fs", "mm", "shm"] }
calloop = "0.14"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "system_fonts", "x11", "wayland"] }
egui = "0.37"
egui_system_font_provider = "0.37"
memchr = "2.8"
encoding_rs = "0.8"
fastrand = "2.5"
tempfile = "3.27"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std", "simd"] }
libwebp-sys = { version = "0.14.4", features = ["sse41", "avx2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10.9"
signal-hook = "0.3"
