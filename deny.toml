[advisories]
version = 2
ignore = [
    # Transitive unmaintained notices (NOT security vulnerabilities; no upstream upgrade available yet):
    # - `ttf-parser` (`RUSTSEC-2026-0192`) and `rustybuzz` (`RUSTSEC-2026-0206`) are transitive
    #   dependencies of `cosmic-text 0.12.1`, `resvg 0.44.0`, and `winit 0.30.13` (`sctk-adwaita`).
    # - Only linked into UI/rendering crates (`radivine-render`, `radivine`, `radivine-control`,
    #   `radivine-viewer`) for trusted bundled SVG icons and UI text shaping; never linked into
    #   `radivine-worker` or `radivine-convert-image` (where untrusted user image files are decoded).
    { id = "RUSTSEC-2026-0192", reason = "Transitive dependency of cosmic-text/resvg/winit; unmaintained notice only, no CVE/unsoundness, not linked into radivine-worker" },
    { id = "RUSTSEC-2026-0206", reason = "Transitive dependency of cosmic-text/resvg; unmaintained notice only, no CVE/unsoundness, not linked into radivine-worker" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # jpeg-encoder 0.7.1 is dual-licensed MIT OR Apache-2.0 OR IJG (Independent JPEG Group permissive license)
    "IJG",
    # clipboard-win / error-code (transitive via arboard 3.7.0 in egui-winit) use Boost Software License 1.0
    "BSL-1.0",
    # epaint_default_fonts 0.37.0 (transitive via egui 0.37.0) includes SIL Open Font License 1.1 and Ubuntu Font Licence 1.0
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
