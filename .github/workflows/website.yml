name: Website release candidate

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/branding/**'
      - 'assets/icons/**'
      - 'assets/fonts/**'
      - 'assets/wheel-icons/**'
      - 'assets/third_party/**'
      - 'docs/**'
      - 'apps/**'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/build-deb.sh'
      - 'scripts/check-dep-graph.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '*.md'
      - 'LICENSE-*'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/branding/**'
      - 'assets/icons/**'
      - 'assets/fonts/**'
      - 'assets/wheel-icons/**'
      - 'assets/third_party/**'
      - 'docs/**'
      - 'apps/**'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/build-deb.sh'
      - 'scripts/check-dep-graph.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '*.md'
      - 'LICENSE-*'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_ORIGIN: https://marawan6569.github.io

jobs:
  verify:
    name: Website checks (${{ matrix.hosting }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - hosting: project
            base: /Radivine/
          - hosting: root
            base: /
    concurrency:
      group: radivine-website-check-${{ github.event.pull_request.number || github.ref }}-${{ matrix.hosting }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: website
    env:
      SITE_BASE: ${{ matrix.base }}
      SITE_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:content && npm run test:demo
      - run: npm run build
      - run: npm run check:links && npm run check:artifact
      - name: Install browsers in the disposable CI runner
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test -- --workers=2
      - name: Preserve browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radivine-website-checks-${{ matrix.hosting }}
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 14
      # W4 publication hold: changing this literal requires separate W5 approval.
      - name: Upload approved static Pages artifact only
        if: >-
          ${{ false && matrix.hosting == 'project' &&
              github.repository == 'marawan6569/Radivine' &&
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
              vars.WEBSITE_APPROVED_SHA == github.sha }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: radivine-website-pages
          path: website/dist

  deploy:
    name: Publish approved website (held for W5)
    needs: verify
    # W4 publication hold. A branch choice or variable alone cannot enable this.
    if: >-
      ${{ false && github.repository == 'marawan6569/Radivine' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          vars.WEBSITE_APPROVED_SHA == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: radivine-website-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: radivine-website-pages
