# Radivine Configuration (`~/.config/radivine/config.toml`)
# Managed graphically by `radivine-control` or edited manually (`radivine reload`).

[trigger]
# Trigger key pressed during an active file drag: "shift", "ctrl", "alt", "super", or "disabled"
drag_modifier = "shift"
# Press the trigger key a second time mid-drag to hide the wheel and continue native drag
toggle_off_on_repress = true
# Dismiss the wheel as soon as the trigger modifier key is released
hold_to_keep_open = false

[wheel]
# Radial wheel layout mode:
#   - "branching"  (default): Submenus open as adjacent offset child wheels connected by a vine stem.
#   - "concentric" (optional Nested Rings): Submenus open as outward concentric rings around the single
#     root center (requires >= 668x742 logical monitor workarea; automatically falls back to "branching"
#     on smaller viewports such as 1280x720@1x without modifying this file).
layout = "branching"

# Root wheel inner and outer radii in logical pixels (20.0..=500.0)
root_inner_radius = 40.0
root_outer_radius = 128.0

# Child submenu wheel inner and outer radii in logical pixels (20.0..=500.0)
child_inner_radius = 34.0
child_outer_radius = 108.0

# Radial gap between parent outer radius and child inner radius in logical pixels (4.0..=80.0)
child_offset_gap = 20.0

# Hover dwell time before a submenu opens automatically in milliseconds (20..=2000)
submenu_dwell_ms = 110

# Intent-triangle diagonal travel grace period in milliseconds (20..=2000)
diagonal_corridor_ms = 180

# Outside-cluster leave grace period in milliseconds (50..=5000)
leave_grace_ms = 350

# Segment boundary angular hysteresis in degrees (0.0..=15.0)
hysteresis_deg = 3.5

[appearance]
# Color theme: "dark", "light", or "auto" (queries GTK_THEME / gtk-3.0/settings.ini)
theme = "dark"

# UI scale factor: "auto" (queries Xft.dpi) or a numeric factor in 0.5..=4.0 (e.g. 1.25)
scale = "auto"

# Reduce animations: "auto" (follows desktop Net/EnableAnimations), true, or false
reduced_motion = "auto"

# Monitor backdrop dimming opacity (0.0..=0.5)
backdrop_dim_alpha = 0.0

[input]
# Safety default: false (capture-all overlay during active sessions so releasing outside
# the wheel cancels cleanly instead of dropping files into underlying windows; ADR-0001).
passthrough = false

[preview]
# Default line count for `File Preview -> Head` (1..=10000)
head_lines = 50

# Default line count for `File Preview -> Tail` (1..=10000)
tail_lines = 50

[notifications]
# Enable desktop notifications via org.freedesktop.Notifications
enabled = true
notify_on_action_error = true
notify_on_config_warning = true

[jobs]
# Maximum parallel conversion items (0 = auto: clamp(num_cpus / 2, 1, 4); explicit 1..=8)
max_parallel = 0
# Maximum terminal jobs retained in ~/.local/state/radivine/jobs.sqlite3 (10..=1000)
retention_max_jobs = 100
# Maximum age in days for terminal jobs before automatic pruning (1..=365)
retention_days = 30
