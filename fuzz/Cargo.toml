bench = false

[[bin]]
name = "convert_toml_parse"
path = "fuzz_targets/convert_toml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_protocol_parse"
path = "fuzz_targets/worker_protocol_parse.rs"
test = false
doc = false
bench = false

